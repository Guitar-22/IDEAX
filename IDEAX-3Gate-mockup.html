<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDEAX 3-Gate Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000;
  /* หมึกเอนไปทางน้ำเงินกรมของโลโก้ ไม่ใช่ดำกลาง ๆ */
  --ink:#16283A; --ink-2:rgba(22,40,58,.62); --ink-3:rgba(22,40,58,.45);
  --hairline:rgba(22,40,58,.14); --hairline-2:rgba(22,40,58,.06);
  --canvas:#F4F6F8; --surface:#FFFFFF;

  /* ---- แบรนด์ IDEAX (ผู้ก่อตั้งส่ง 6 ก.ย. 2569) ----
     Student Ideas. Real Impact. · Bridging a Brighter Tomorrow
     เขียวสดของโลโก้ #4CAF6E อยู่ที่ 2.74:1 บนพื้นขาว ใช้เป็นตัวอักษรหรือปุ่มไม่ได้
     จึงแยกสองระดับเหมือนเดิม: brand-* สำหรับโลโก้และกราฟิกชิ้นใหญ่
     กับสีที่มีความหมาย (verified/proposed) ที่เข้มพอผ่าน AA ทุกพื้น
     คอนทราสต์ที่คำนวณไว้: verified #28704A 5.99 บนขาว · 5.53 บน canvas
                            proposed #215FA6 6.46 บนขาว · 5.96 บน canvas */
  --brand-navy:#1B3A5F; --brand-blue:#215FA6; --brand-teal:#2E9E96; --brand-green:#4CAF6E;

  --proposed:#215FA6; --proposed-t:#E7EFF9;
  --verified:#28704A; --verified-t:#E6F2EB;
  --attention:rgba(0,0,0,.45); --attention-t:rgba(0,0,0,.045);
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --lift:0 1px 2px rgba(0,0,0,.05), 0 8px 24px -12px rgba(0,0,0,.18);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--canvas);color:var(--ink);
  font-family:'Anuphan',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.78em;letter-spacing:-.01em;}
h1,h2,h3,h4,h5{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.25;}
h1{font-size:26px;letter-spacing:-.03em;} h2{font-size:20px;} h3{font-size:17px;} h4{font-size:14.5px;} h5{font-size:14px;}
p{margin:0 0 12px;} a{color:var(--proposed);}
button{font-family:inherit;}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px;}
.muted{color:var(--ink-2);} .dim{color:var(--ink-3);}
.fs13{font-size:13px;} .fs14{font-size:14px;} .fs15{font-size:15px;}
.mt0{margin-top:0;} .mb0{margin-bottom:0;}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--hairline);}
.appbar-in{display:flex;align-items:center;gap:16px;padding:10px 20px;max-width:1240px;margin:0 auto;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;}
.logo-mark{flex-shrink:0;}
.logo-word{font-size:20px;font-weight:700;letter-spacing:.01em;line-height:1;font-style:normal;}
.logo-word b{color:var(--brand-navy);font-weight:700;}
.logo-word i{font-style:normal;font-weight:700;color:var(--brand-teal);
  background:linear-gradient(120deg,var(--brand-blue),var(--brand-green));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.brand small{font-weight:400;color:var(--ink-3);font-size:12.5px;letter-spacing:0;}
.logo-tag{letter-spacing:.04em;}
.logo-demo{border-left:1px solid var(--hairline);padding-left:9px;}
@media (max-width:1080px){ .logo-tag{display:none;} }
@media (max-width:640px){ .logo-demo{display:none;} }
.seg{display:flex;gap:2px;background:var(--hairline-2);border-radius:999px;padding:3px;}
.seg button{border:none;background:transparent;font-size:13.5px;font-weight:500;color:var(--ink-2);
  padding:6px 13px;border-radius:999px;cursor:pointer;transition:.16s;white-space:nowrap;}
.seg button:hover{color:var(--ink);}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
.bar-tools{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.tgl{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);
  border:1px solid var(--hairline);background:var(--surface);padding:5px 11px;border-radius:999px;cursor:pointer;}
.tgl .sw{width:26px;height:15px;border-radius:999px;background:var(--hairline);position:relative;transition:.18s;flex-shrink:0;}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:.18s;
  box-shadow:0 1px 2px rgba(0,0,0,.25);}
.tgl.on{color:var(--ink);border-color:var(--proposed);}
.tgl.on .sw{background:var(--proposed);} .tgl.on .sw::after{left:13px;}
.tgl.on.warn{border-color:rgba(0,0,0,.45);} .tgl.on.warn .sw{background:var(--attention);}

/* ---------- spine ---------- */
.spine{background:var(--surface);border-bottom:1px solid var(--hairline);}
.spine-in{display:flex;align-items:center;max-width:1240px;margin:0 auto;padding:9px 20px;overflow-x:auto;}
.stp{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);white-space:nowrap;}
.stp .b{width:15px;height:15px;border-radius:50%;border:1.5px dashed rgba(0,0,0,.3);display:grid;place-items:center;
  font-size:9px;color:var(--ink-3);flex-shrink:0;}
.stp.done{color:var(--ink);} .stp.done .b{background:var(--verified);border:none;color:#fff;}
.stp.now{color:var(--proposed);} .stp.now .b{background:var(--proposed);border:none;color:#fff;}
.stp-sep{width:18px;height:1px;background:var(--hairline);margin:0 8px;flex-shrink:0;}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;
  padding:3px 10px;border-radius:999px;line-height:1.5;white-space:nowrap;}
.chip .dot{width:6px;height:6px;border-radius:50%;}
.chip.p{background:var(--proposed-t);color:var(--proposed);} .chip.p .dot{background:var(--proposed);}
.chip.v{background:var(--verified-t);color:var(--verified);} .chip.v .dot{background:var(--verified);}
.chip.a{background:transparent;color:var(--ink-2);border:1px dashed rgba(0,0,0,.28);padding:2px 9px;} .chip.a .dot{background:var(--ink-3);}
.chip.n{background:var(--hairline-2);color:var(--ink-2);} .chip.n .dot{background:var(--ink-3);}

/* ---------- buttons ---------- */
.btn{font-size:13.5px;font-weight:500;padding:8px 12px;border-radius:var(--r-sm);
  border:1px solid var(--hairline);background:var(--surface);color:var(--ink);cursor:pointer;transition:.16s;}
.btn:hover{background:var(--hairline-2);}
.btn.pri{background:var(--verified);border-color:var(--verified);color:#fff;}
.btn.pri:hover{filter:brightness(1.08);background:var(--verified);}
.btn.blue{background:var(--proposed);border-color:var(--proposed);color:#fff;}
.btn.blue:hover{filter:brightness(1.08);background:var(--proposed);}
.btn.warn{color:var(--ink-2);border-style:dashed;}
.btn.wide{width:100%;} .btn.sm{font-size:12.5px;padding:6px 11px;}
.btn{min-height:34px;}
.btn:disabled{opacity:.42;cursor:not-allowed;}
.btn:focus-visible{outline:2px solid var(--proposed);outline-offset:2px;}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;} .acts .full{grid-column:1/-1;}

/* ---------- panel / card ---------- */
.panel{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--lift);overflow:hidden;}
.panel-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;
  border-bottom:1px solid var(--hairline);background:rgba(252,252,253,.9);font-size:13.5px;color:var(--ink-2);flex-wrap:wrap;}
.panel-bar strong{color:var(--ink);font-weight:600;font-size:14.5px;}
.card{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:16px;}
.card.click{cursor:pointer;transition:.16s;}
.card.click:hover{border-color:var(--proposed);box-shadow:0 0 0 3px var(--proposed-t);}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px;}
.stack{display:flex;flex-direction:column;gap:10px;}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.between{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.sec-head{margin:26px 0 12px;}
.sec-head p{max-width:70ch;color:var(--ink-2);font-size:14.5px;margin:6px 0 0;}
main{padding:22px 0 90px;}

/* ---------- rules ---------- */
.rule{border-left:3px solid var(--verified);background:var(--verified-t);padding:12px 15px;
  border-radius:0 var(--r-md) var(--r-md) 0;margin:14px 0;font-size:14px;}
.rule.info{border-left-color:var(--proposed);background:var(--proposed-t);}
.rule.warn{border-left:3px dashed rgba(0,0,0,.35);background:var(--attention-t);}
.rule b{display:block;margin-bottom:3px;}

/* ---------- explain mode ---------- */
.spec{display:none;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2);
  border:1px dashed rgba(0,0,0,.25);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;white-space:nowrap;}
body.explain .spec{display:inline-block;}
.spec-note{display:none;font-size:12.5px;color:var(--ink-2);background:var(--attention-t);
  border:1px dashed rgba(0,0,0,.2);border-radius:var(--r-sm);padding:8px 11px;margin:9px 0;line-height:1.55;}
body.explain .spec-note{display:block;}

/* ---------- three pane ---------- */
.three{display:grid;grid-template-columns:214px 1fr 336px;min-height:560px;}
.pane{padding:15px;min-width:0;}
.pane-l{border-right:1px solid var(--hairline);background:#FAFAFB;}
.pane-c{border-right:1px solid var(--hairline);}
.pane-r{background:linear-gradient(180deg,#FCFCFD,#F8F9FA);}
.pane-title{font-size:12.5px;color:var(--ink-3);margin-bottom:10px;}
.ptabs{display:none;gap:2px;padding:8px 12px 0;background:#FAFAFB;border-bottom:1px solid var(--hairline);}
.ptabs button{flex:1;border:none;background:transparent;font-size:13.5px;font-weight:500;color:var(--ink-2);
  padding:9px 4px;border-bottom:2px solid transparent;cursor:pointer;}
.ptabs button.on{color:var(--ink);border-bottom-color:var(--proposed);}

.qitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);
  font-size:13.5px;margin-bottom:3px;cursor:pointer;transition:background .16s;border:1px solid transparent;}
.qitem:hover{background:var(--hairline-2);}
.qitem.sel{background:var(--surface);border-color:var(--hairline);box-shadow:0 1px 2px rgba(0,0,0,.05);}
.qbadge{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.qbadge.none{background:transparent;border:1.5px dashed rgba(0,0,0,.45);}

.doc-area{display:grid;grid-template-columns:16px 1fr;gap:14px;}
.rail{border-radius:999px;background:var(--hairline-2);position:relative;width:6px;margin-left:5px;min-height:340px;}
.rail i{position:absolute;left:-3px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--surface);cursor:pointer;}
.rail i.none{background:var(--surface);border:1.5px dashed rgba(0,0,0,.4);cursor:default;}
.doc-body{font-size:14.5px;line-height:1.95;color:var(--ink-2);min-width:0;}
.doc-body h5{margin:0 0 6px;color:var(--ink);}
.doc-body .sec{margin-bottom:16px;}
.span{border-radius:5px;padding:1px 3px;margin:0 -3px;cursor:pointer;color:var(--ink);
  transition:background .22s ease, box-shadow .22s ease;}
.span:hover{background:var(--hairline-2);}
.span.on{background:var(--proposed-t);box-shadow:inset 0 -2px 0 var(--proposed);}
.span.on.v{background:var(--verified-t);box-shadow:inset 0 -2px 0 var(--verified);}
.unread{font-size:13px;color:var(--ink-2);margin-top:12px;padding:9px 11px;background:var(--attention-t);
  border:1px dashed rgba(0,0,0,.22);border-radius:var(--r-sm);}

.crit{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:13px;margin-bottom:10px;}
.crit.isv{border-color:rgba(63,116,28,.34);}
.crit-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.levels{display:flex;gap:5px;margin-bottom:9px;}
.lv{flex:1;text-align:center;font-size:13px;font-weight:500;padding:7px 0;border-radius:var(--r-sm);
  border:1px solid var(--hairline);background:var(--surface);color:var(--ink-2);cursor:pointer;transition:.16s;}
.lv:hover{border-color:var(--ink-3);}
.lv.on{background:var(--proposed);border-color:var(--proposed);color:#fff;}
.lv.on.v{background:var(--verified);border-color:var(--verified);}
.levels.off{opacity:.4;pointer-events:none;}
.evid{font-size:12.5px;color:var(--ink-2);background:var(--hairline-2);border-radius:var(--r-sm);
  padding:8px 10px;margin-bottom:9px;line-height:1.5;cursor:pointer;transition:.16s;}
.evid:hover{background:var(--proposed-t);}
.evid.isv{background:var(--verified-t);}
.evid.none{background:transparent;border:1px dashed rgba(0,0,0,.22);cursor:default;}
.trail{font-size:12px;color:var(--ink-2);border-top:1px solid var(--hairline-2);margin-top:9px;padding-top:8px;line-height:1.5;}

/* ---------- lists / tables ---------- */
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-2);padding:9px 12px;
  border-bottom:1px solid var(--hairline);background:#FAFAFB;}
td{padding:10px 12px;border-bottom:1px solid var(--hairline-2);vertical-align:top;color:var(--ink-2);}
td strong{color:var(--ink);font-weight:600;} tr:last-child td{border-bottom:none;}
.tbl{border:1px solid var(--hairline);border-radius:var(--r-md);overflow:hidden;background:var(--surface);}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

.pc{display:flex;gap:12px;padding:13px;border:1px solid var(--hairline);border-radius:var(--r-md);
  background:var(--surface);margin-bottom:9px;align-items:flex-start;}
.pc-ic{width:25px;height:25px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  font-size:13px;font-weight:600;color:#fff;margin-top:2px;}
.pc-ic.ok{background:var(--verified);}
.pc-ic.att{background:var(--surface);border:1.5px dashed rgba(0,0,0,.4);color:var(--ink-2);}
.pc p{font-size:13.5px;color:var(--ink-2);margin:2px 0 0;}

.dsec{border-top:1px solid var(--hairline-2);padding-top:10px;margin-top:10px;font-size:13.5px;color:var(--ink-2);}
.dsec b{color:var(--ink);font-weight:600;display:block;font-size:12.5px;margin-bottom:2px;}
.dmeta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;}
input[type=text],textarea,select{width:100%;font-family:inherit;font-size:14.5px;color:var(--ink);
  border:1px solid var(--hairline);border-radius:var(--r-sm);padding:9px 11px;background:var(--surface);}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--proposed);box-shadow:0 0 0 3px var(--proposed-t);}
textarea{resize:vertical;min-height:74px;line-height:1.6;}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--ink-2);padding:7px 0;cursor:pointer;}
.check input{margin-top:5px;flex-shrink:0;accent-color:var(--verified);width:16px;height:16px;}

/* ---------- modal / drawer / toast ---------- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:60;display:grid;place-items:center;padding:20px;}
.modal{background:var(--surface);border-radius:var(--r-lg);max-width:530px;width:100%;padding:22px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.4);max-height:88vh;overflow:auto;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:70;
  border-left:1px solid var(--hairline);box-shadow:-20px 0 50px -24px rgba(0,0,0,.35);display:flex;flex-direction:column;}
.drawer-h{padding:14px 18px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center;gap:10px;}
.drawer-b{padding:14px 18px;overflow:auto;flex:1;}
.log{font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.6;color:var(--ink-2);
  border-bottom:1px solid var(--hairline-2);padding:8px 0;word-break:break-word;}
.log b{color:var(--ink);font-weight:500;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
  font-size:13.5px;padding:10px 16px;border-radius:999px;z-index:80;box-shadow:var(--lift);max-width:90vw;text-align:center;}

.empty{text-align:center;padding:34px 18px;color:var(--ink-2);font-size:14px;}
.empty .b{width:34px;height:34px;border-radius:50%;border:1.5px dashed rgba(0,0,0,.3);margin:0 auto 10px;}

@media (max-width:980px){
  .three{grid-template-columns:1fr;}
  .three .pane{display:none;} .three .pane.act{display:block;}
  .pane-l,.pane-c{border-right:none;}
  .ptabs{display:flex;}
}
@media (max-width:640px){
  .appbar-in{padding:9px 14px;gap:10px;} .wrap{padding:0 14px;}
  h1{font-size:22px;} .seg button{padding:8px 12px;font-size:13px;}
  .acts{grid-template-columns:1fr;}
  .btn{min-height:42px;} .btn.pri,.btn.blue{min-height:48px;}
  .qitem{padding:11px 10px;} .g{padding:10px 0;} .ann{width:34px;height:34px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
.lvnow{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin:-2px 0 9px;}
.lvnow b{color:var(--ink);font-weight:600;}
details.lvall{margin:0 0 9px;}
details.lvall > summary{font-size:12.5px;color:var(--ink-2);cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:5px;padding:2px 0;}
details.lvall > summary::-webkit-details-marker{display:none;}
details.lvall > summary::before{content:"▸";font-size:10px;color:var(--ink-3);}
details.lvall[open] > summary::before{content:"▾";}
.lvrow{display:grid;grid-template-columns:26px 1fr;gap:9px;padding:7px 9px;border-radius:var(--r-sm);
  font-size:12.5px;color:var(--ink-2);line-height:1.5;border:1px solid transparent;}
.lvrow .n{font-weight:600;color:var(--ink);text-align:center;}
.lvrow.pick{background:var(--proposed-t);border-color:rgba(43,79,162,.32);}
.lvrow.pick.v{background:var(--verified-t);border-color:rgba(63,116,28,.32);}
.lvlist .lvrow{cursor:pointer;} .lvlist .lvrow:hover{background:var(--hairline-2);}
.lvlist .lvrow.on{background:var(--proposed-t);border-color:var(--proposed);}

/* ---------- rubric items (DBA Literature Review) ---------- */
.crigrp{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);margin-bottom:12px;overflow:hidden;}
.crigrp-h{padding:11px 13px;border-bottom:1px solid var(--hairline-2);background:#FCFCFD;}
.crigrp-h h4{display:flex;align-items:baseline;gap:7px;}
.crigrp-h .no{color:var(--ink-3);font-weight:600;font-size:13px;}
.crigrp-h p{font-size:12.5px;color:var(--ink-2);margin:5px 0 0;line-height:1.5;}
.crigrp-h .th{font-size:12.5px;color:var(--ink-3);margin:3px 0 0;}
.crigrp-b{padding:11px 13px;}
.gsum{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 13px;
  border-top:1px solid var(--hairline-2);background:#FCFCFD;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap;}

.it{border-top:1px solid var(--hairline-2);padding:11px 0;}
.it:first-child{border-top:none;padding-top:2px;}
.it-h{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;}
.it-h .no{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3);padding-top:2px;}
.it-h p{font-size:13px;line-height:1.55;margin:0;color:var(--ink);}
.it-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:7px 0 0 38px;}

.gstrip{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:8px 0;}
.g{text-align:center;font-size:12px;font-weight:500;padding:6px 0;border-radius:6px;

.g:hover{border-color:var(--ink-3);}

.gstrip.off{opacity:.4;pointer-events:none;}
.glab{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin:-4px 0 8px;}

.anns{display:flex;gap:4px;}
.ann{font-size:11.5px;font-weight:600;width:26px;height:26px;border-radius:6px;border:1px dashed rgba(0,0,0,.3);
  background:transparent;color:var(--ink-2);cursor:pointer;transition:.16s;display:grid;place-items:center;}
.ann:hover{border-color:var(--ink);}
.ann.on{background:var(--attention-t);border-style:solid;border-color:rgba(0,0,0,.55);color:var(--ink);}
.ann-key{font-size:11.5px;color:var(--ink-3);margin-left:4px;}

.bar3{position:relative;height:6px;border-radius:999px;background:var(--hairline-2);margin:9px 0 4px;}
.bar3 span{position:absolute;top:0;bottom:0;left:0;border-radius:999px;background:var(--verified);}
.bar3 i{position:absolute;top:-4px;bottom:-4px;width:2px;background:rgba(0,0,0,.45);}
.bar3.under span{background:var(--attention);}


/* ---------- Gate 3 · discovery ---------- */
.c-hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#FFFFFF,#FBFAF8);
  border:1px solid var(--hairline);border-radius:var(--r-xl);padding:30px 20px 22px;box-shadow:var(--lift);}
.c-hero::before{content:"";position:absolute;top:-46%;right:-16%;width:44%;height:200%;
  background:var(--brand-green);opacity:.13;border-radius:50% 0 0 50%/50% 0 0 50%;pointer-events:none;}
.c-hero > *{position:relative;}
.c-search{display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto;
  background:var(--surface);border:1px solid var(--hairline);border-radius:999px;padding:6px 6px 6px 16px;
  box-shadow:0 1px 2px rgba(0,0,0,.05);}
.c-search:focus-within{border-color:var(--proposed);box-shadow:0 0 0 3px var(--proposed-t);}
.c-search-ic{color:var(--ink-3);display:flex;flex-shrink:0;}
.c-search input{border:none;background:transparent;padding:8px 0;font-size:15px;flex:1;min-width:0;}
.c-search input:focus{outline:none;box-shadow:none;}
.c-search .btn{border-radius:999px;padding:9px 18px;flex-shrink:0;}

.c-intents{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:10px;}
.c-intent{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;
  border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);
  padding:13px;cursor:pointer;transition:.16s;font-family:inherit;}
.c-intent:hover{border-color:var(--proposed);box-shadow:0 0 0 3px var(--proposed-t);}
.c-intent.on{border-color:var(--verified);box-shadow:0 0 0 3px var(--verified-t);}
.c-intent strong{font-size:14.5px;color:var(--ink);}
.c-intent span{font-size:12.5px;color:var(--ink-2);line-height:1.5;}

.c-cats{display:flex;gap:4px;overflow-x:auto;padding:14px 14px 4px;-webkit-overflow-scrolling:touch;}
.c-cat{flex:0 0 auto;width:104px;display:flex;flex-direction:column;align-items:center;gap:6px;
  border:none;background:transparent;color:var(--ink-2);padding:10px 6px;border-radius:var(--r-md);
  cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;transition:.16s;}
.c-cat:hover{background:var(--hairline-2);color:var(--ink);}
.c-cat.on{color:var(--proposed);border-bottom-color:var(--proposed);}
.c-cat .nm{font-size:12px;line-height:1.35;text-align:center;}
.c-cat .ct{font-size:11px;color:var(--ink-3);font-family:'IBM Plex Mono',monospace;}

.c-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px;padding:10px 14px 14px;}
.c-tile{display:flex;flex-direction:column;justify-content:flex-end;gap:3px;min-height:82px;text-align:left;
  border:1px solid var(--hairline);border-radius:var(--r-md);padding:12px;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,#FCFCFD,#F2F4F6);transition:.16s;}
.c-tile:hover{border-color:var(--proposed);box-shadow:0 0 0 3px var(--proposed-t);}
.c-tile .t{font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em;}
.c-tile .s{font-size:12.5px;color:var(--ink-2);}

.c-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.c-tab{flex:0 0 auto;font-size:14px;font-weight:500;padding:9px 18px;border-radius:var(--r-sm);
  border:1px solid var(--hairline);background:var(--surface);color:var(--ink-2);cursor:pointer;font-family:inherit;transition:.16s;}
.c-tab:hover{color:var(--ink);}
.c-tab.on{border-color:var(--proposed);color:var(--proposed);background:var(--proposed-t);}

.c-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;
  border-bottom:1px solid var(--hairline);margin-bottom:14px;}
.c-bar .btn{display:inline-flex;align-items:center;gap:6px;}
.c-sort{display:flex;align-items:center;gap:6px;color:var(--ink-2);}
.c-sort select{width:auto;font-size:13.5px;padding:7px 9px;}

.c-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px;}

  overflow:hidden;display:flex;flex-direction:column;transition:.16s;}

.c-card-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--hairline-2);}
.c-ava{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:var(--hairline-2);color:var(--ink-2);font-weight:600;font-size:15px;}
.c-own{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-cover{min-height:104px;display:grid;place-items:center;padding:16px;
  background:linear-gradient(135deg,#F2F4F6,#E9ECEF);border-bottom:1px solid var(--hairline-2);}
.c-cover span{font-size:15px;font-weight:600;line-height:1.45;letter-spacing:-.02em;color:var(--ink);text-align:center;}
.c-card-b{padding:12px 14px;flex:1;}
.c-card-f{display:flex;align-items:center;gap:7px;padding:11px 14px;border-top:1px solid var(--hairline-2);
  background:#FCFCFD;flex-wrap:wrap;}
@media (max-width:640px){
  .c-hero{padding:20px 14px 16px;} .c-cat{width:92px;}
  .c-tab{padding:11px 16px;}
}

/* ---------- Gate 3 · tier · verification · price ---------- */
.c-cover{height:132px;display:block;padding:0;border-bottom:1px solid var(--hairline-2);}
.c-cover svg{display:block;width:100%;height:100%;}
.tier{display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.02em;
  padding:3px 9px;border-radius:6px;white-space:nowrap;flex-shrink:0;}
.tier.a{background:var(--verified);color:#fff;}
.tier.b{background:var(--hairline-2);color:var(--ink);border:1px solid var(--hairline);}

.c-verify{border:1px solid rgba(63,116,28,.30);background:var(--verified-t);border-radius:var(--r-sm);

.c-price b{color:var(--ink);font-weight:600;white-space:nowrap;}

.c-tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px;padding:14px;}

.buylist{display:flex;flex-direction:column;gap:8px;}

.buyopt:hover{border-color:var(--ink-3);}
.buyopt.on{border-color:var(--verified);background:var(--verified-t);box-shadow:0 0 0 2px var(--verified-t);}

/* ---------- Gate 3 · taxonomy ---------- */
.c-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:10px;padding:12px 14px 14px;}
.c-tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:118px;text-align:left;
  border:1px solid var(--hairline);border-radius:var(--r-md);padding:12px;cursor:pointer;font-family:inherit;
  background:linear-gradient(140deg,#FFFFFF,#F7F7F5);transition:.16s;}
.c-tile:hover{border-color:var(--proposed);box-shadow:0 0 0 3px var(--proposed-t);}
.c-tile.on{border-color:var(--verified);box-shadow:0 0 0 3px var(--verified-t);}
.c-tile .gtag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;color:var(--proposed);
  background:var(--proposed-t);border-radius:4px;padding:2px 6px;}
.c-tile .t{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em;margin-top:5px;}
.c-tile .s{font-size:12.5px;color:var(--ink-2);line-height:1.5;}
.c-tile .s2{font-size:12px;color:var(--ink-3);margin-top:auto;padding-top:6px;}
.c-sel{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;
  border:1px solid rgba(43,79,162,.28);background:var(--proposed-t);border-radius:var(--r-md);
  padding:13px 15px;margin-bottom:14px;}
.grp{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);margin-bottom:10px;overflow:hidden;}
.grp-h{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-family:inherit;
  border:none;background:transparent;padding:13px 15px;cursor:pointer;color:var(--ink);font-size:14.5px;}
.grp-h:hover{background:var(--hairline-2);}
.grp-ic{color:var(--ink-3);display:flex;flex-shrink:0;}
.grp-n{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;letter-spacing:.04em;color:var(--proposed);}
.grp-ask{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px;}
.grp-b{border-top:1px solid var(--hairline-2);padding:6px 15px 12px;}
.tp{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--hairline-2);flex-wrap:wrap;}
.tp:last-child{border-bottom:none;}
.tp.has:hover{background:var(--proposed-t);}
.tp-n{color:var(--ink-3);width:26px;flex-shrink:0;font-size:11px;}
.tp-t{flex:1;min-width:140px;font-size:13.5px;}
.mvp{font-size:11.5px;font-weight:600;color:var(--verified);background:var(--verified-t);
  border:1px solid rgba(63,116,28,.3);border-radius:999px;padding:2px 9px;white-space:nowrap;}

/* ---------- แดชบอร์ดเทรนด์ ---------- */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:12px;margin-top:16px;}
.stat{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:14px 15px;}
.stat-n{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1;color:var(--ink);
  font-variant-numeric:tabular-nums;}

.stat-s{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.45;}

.chart{display:flex;flex-direction:column;gap:2px;}
.brow{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(120px,2.4fr) 64px;gap:12px;align-items:center;
  padding:5px 6px;border-radius:var(--r-sm);cursor:pointer;}
.brow:hover{background:var(--hairline-2);}
.brow-l{font-size:13.5px;color:var(--ink);}
.brow-t{position:relative;height:26px;display:flex;align-items:center;min-width:0;}
.bar{height:14px;border-radius:0 4px 4px 0;background:var(--proposed);min-width:4px;flex-shrink:0;}
.bar.none{background:transparent;border:1.5px dashed rgba(0,0,0,.32);height:16px;border-radius:4px;}
.brow-v{font-size:12px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;}

.brow-v.out{color:var(--ink-2);margin-left:8px;font-weight:500;}
.brow-v.in.dim{color:var(--ink-2);font-weight:500;}
.brow-r{font-size:12px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums;}
@media (max-width:640px){ .brow{grid-template-columns:1fr;gap:2px;} .brow-r{text-align:left;} }

.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);
  border-top:1px solid var(--hairline-2);margin-top:10px;padding-top:9px;}

.tseg{display:grid;place-items:center;font-size:12.5px;font-weight:600;border-radius:4px;min-width:44px;
  font-variant-numeric:tabular-nums;}

.tip{position:fixed;z-index:90;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.45;
  padding:7px 10px;border-radius:8px;pointer-events:none;max-width:280px;box-shadow:var(--lift);}

}

function docHTML(){
  var v = S.flow.revised;
  return ''+
  '<div class="sec"><h5>2.1 Introduction</h5><p style="margin:0">'+
    '<span class="span" data-anchor="a1">Family-owned firms account for a substantial share of Thai SMEs, yet many falter when a second or third generation takes over: the successor inherits a business whose customer records, pricing rules and supplier relationships exist mainly in the founder\'s memory.</span> '+
    'This chapter reviews what prior research tells us about that transition. '+
    '<span class="span" data-anchor="a7">The chapter is organised around three questions: what is known about succession in family firms, how digital adoption has been theorised, and where the two literatures fail to meet.</span>'+
  '</p></div>'+

  '<div class="sec"><h5>2.2 Three bodies of literature</h5><p style="margin:0">'+
    '<span class="span" data-anchor="a2">Three distinct bodies of literature inform this study. The first concerns succession in family business (Handler, 1994; Nordqvist et al., 2013). The second concerns technology adoption in small firms, dominated by TAM and its extensions (Davis, 1989; Venkatesh &amp; Bala, 2008). The third, smaller and more recent, examines digital capability building in emerging economies.</span> '+
    '<span class="span" data-anchor="a3">Where the succession literature is largely qualitative and case-based, the adoption literature is overwhelmingly survey-based, and the two rarely cite one another.</span>'+
  '</p></div>'+

  '<div class="sec"><h5>2.3 Theoretical framing</h5><p style="margin:0">'+
    '<span class="span" data-anchor="a4">This study adopts the dynamic capabilities view (Teece, 2007) as its lens, defining digital capability as the firm\'s capacity to sense, seize and reconfigure around digital opportunity.</span> '+
    '<span class="span" data-anchor="a5">The construct emerged from Teece, Pisano and Shuen\'s (1997) attempt to explain why firms in the same industry respond differently to the same technological shift, and was later narrowed by Eisenhardt and Martin (2000).</span> '+
    '<span class="span" data-anchor="a6">Prior applications include studies of Thai manufacturing SMEs and of retail chains in Vietnam, where the lens explained variation in adoption speed that firm size alone could not.</span>'+
  '</p></div>'+

  '<div class="sec"><h5>2.4 Where the literatures meet</h5><p style="margin:0">'+
    '<span class="span" data-anchor="a8">Having set out these three bodies of work and the lens through which they are read, the chapter now turns to what remains unresolved between them.</span>'+
    (v ? ' <span class="span" data-anchor="a8">What the succession literature has not established is whether a successor\'s digital capability is inherited from the founder\'s systems or built in spite of them; this matters because the two explanations imply opposite interventions for the roughly 2.8 million family SMEs in Thailand.</span>' : '')+
  '</p></div>'+

  '<div class="sec"><h5>2.5 Positioning of the present study</h5><p style="margin:0">'+
    '<span class="span" data-anchor="a9">The present investigation follows twelve second-generation successors over one academic year'+
    (v ? ', and is designed specifically to separate the two explanations above by observing which systems each successor keeps, replaces or rebuilds' : '')+
    '.</span>'+
  '</p></div>'+

  (v
    ? '<div class="sec"><h5>Figure 2.1 · Conceptual framework</h5><p style="margin:0">แปลงจากภาพเป็นตารางข้อความแล้วในฉบับนี้ (3 ชั้น 9 องค์ประกอบ)</p></div>'

  '<div class="unread" style="background:transparent">รายการอ้างอิงอยู่ในไฟล์แยกที่ยังไม่ได้ส่ง — ข้อ 4.4 จึงตรวจไม่ได้</div>';
}

  var under = s.avg!==null && s.avg < PASS;
  return '<div class="card" style="padding:13px;background:#FCFCFD">'+
    '<div class="between"><h4>ค่าเฉลี่ยที่ยืนยันแล้ว</h4>'+
      (s.avg!==null
        ? '<span class="chip '+(under?'a':'v')+'"><span class="dot"></span> '+s.avg.toFixed(2)+' จาก 4</span>'
        : '<span class="chip a"><span class="dot"></span> ยังไม่มี</span>')+'</div>'+
    '<div class="bar3'+(under?' under':'')+'"><span style="width:'+pct+'%"></span><i style="left:'+(PASS/4*100)+'%"></i></div>'+
    '<div class="glab"><span>F</span><span>เส้นผ่าน 3.0</span><span>A</span></div>'+
    '<p class="fs13 muted" style="margin:6px 0 0">คำนวณจาก '+s.n+' ข้อที่ยืนยันแล้วจากทั้งหมด '+s.total+' ข้อ'+

    '<p class="dim fs13" style="margin:6px 0 0">เอกสารเกณฑ์ต้นฉบับไม่ได้ระบุน้ำหนักรายข้อ ระบบจึงถ่วงน้ำหนักเท่ากันและเขียนกำกับไว้ ไม่เดาน้ำหนักเอง '+spec('AC-04')+'</p>'+
  '</div>';
}

function criGroup(cr){
  var its=itemsOf(cr.id), open = S.openCri===cr.id;
  var avg=criAvg(cr.id);
  var pend=its.filter(function(i){ return i.status==='proposed'; });
  return '<div class="crigrp">'+
    '<div class="crigrp-h" data-act="opencri" data-c="'+cr.id+'" style="cursor:pointer">'+
      '<div class="between"><h4><span class="no">'+cr.no+'.</span> '+cr.name+'</h4>'+
        (avg!==null?'<span class="chip '+(avg<PASS?'a':'v')+'"><span class="dot"></span> '+avg.toFixed(2)+'</span>'
                   :'<span class="chip n"><span class="dot"></span> '+its.filter(decided).length+'/4</span>')+'</div>'+
      '<p>'+cr.purpose+'</p><p class="th">'+cr.th+'</p>'+
    '</div>'+
    (open ? '<div class="crigrp-b">'+its.map(itemCard).join('')+'</div>'+
      (pend.length>1 ? '<div class="gsum"><span>ระบบเสนอไว้ '+pend.length+' ข้อ และคุณยังไม่ได้แตะ</span>'+
        '<button class="btn sm pri" data-act="accept-cri" data-c="'+cr.id+'">ยืนยันทั้ง '+pend.length+' ข้อตามที่เสนอ</button></div>' : '')
      : '<div class="gsum"><span>'+its.filter(decided).length+' จาก 4 ข้อตัดสินแล้ว</span>'+
        '<button class="btn sm" data-act="opencri" data-c="'+cr.id+'">เปิดดู</button></div>')+
  '</div>';
}

function itemCard(it){
  var isV=it.status==='verified', isF=it.status==='flagged', isA=it.status==='attention';
  var g = isF ? null : (it.grade||null);
  var strip='<div class="gstrip'+((isF||isA)&&!g?' off':'')+'">'+GRADES.map(function(G){
      var on = (g===G.k) ? ' on'+(isV?' v':'') : '';
      return '<div class="g'+on+(G.k==='B'?' bar':'')+'" data-act="grade" data-i="'+it.id+'" data-g="'+G.k+'">'+G.k+'</div>';
    }).join('')+'</div>';
  var ev;
  if(isA) ev='<div class="evid none">'+it.why+'</div>';
  else if(it.kind==='absence') ev='<div class="evid none" data-act="anchor" data-anchor="'+it.anchors[0]+'" style="cursor:pointer">'+
      it.why+' →</div>';
  else ev='<div class="evid'+(isV?' isv':'')+'" data-act="anchor" data-anchor="'+it.anchors[0]+'">'+
      it.why+' · '+ANCH[it.anchors[0]].loc+' →</div>';
  var anns='<div class="anns">'+Object.keys(ANN).map(function(k){
      return '<button class="ann'+(it.ann.indexOf(k)>=0?' on':'')+'" title="'+ANN[k]+'" data-act="ann" data-i="'+it.id+'" data-k="'+k+'">'+k+'</button>';
    }).join('')+'</div>';
  var acts = decided(it)
    ? '<button class="btn sm" data-act="undo" data-i="'+it.id+'">ย้อนการตัดสินใจ</button>'
    : (isA
        ? '<button class="btn sm" data-act="t-open-src" data-i="'+it.id+'">เปิดต้นฉบับ</button>'+
          '<button class="btn sm" data-act="grade-open" data-i="'+it.id+'">ให้เกรดเอง</button>'+
          '<button class="btn sm warn" data-act="flag" data-i="'+it.id+'">ส่งกลับให้แก้</button>'
        : '<button class="btn sm pri" data-act="accept" data-i="'+it.id+'">ยืนยัน '+it.ai+'</button>'+
          '<button class="btn sm warn" data-act="flag" data-i="'+it.id+'">ส่งกลับให้แก้</button>');
  var trail='';
  if(isV && it.ai===null) trail='<div class="trail">ระบบไม่ได้เสนอเกรดข้อนี้ · อาจารย์ให้ '+it.grade+' เอง<br><span class="mono">human_only = true</span></div>';
  else if(isV && it.grade!==it.ai) trail='<div class="trail">ระบบเสนอ '+it.ai+' · อาจารย์ปรับเป็น '+it.grade+
      (it.reason?'<br>เหตุผล: '+esc(it.reason):'')+'<br><span class="mono">ข้อเสนอเดิมยังอยู่ในระบบ ไม่ถูกเขียนทับ</span></div>';
  else if(isV) trail='<div class="trail">ยืนยันตามข้อเสนอ '+it.grade+' · ผศ.ดร. กมลชนก วีรกุล · 6 ก.ย. 2026</div>';
  else if(isF) trail='<div class="trail">ส่งกลับให้ผู้เรียนแก้ · ยังไม่ให้เกรด (null ไม่ใช่ F)'+
      (it.ann.length?' · รหัส '+it.ann.join(' '):'')+(it.reason?'<br>'+esc(it.reason):'')+'</div>';
  return '<div class="it">'+
    '<div class="it-h"><span class="no">'+it.no+'</span><p>'+it.text+'</p></div>'+
    '<div class="it-body">'+
      '<div class="row" style="justify-content:space-between;margin:7px 0 0">'+chip(it.status)+anns+'</div>'+
      strip + ev +
      '<div class="row" style="gap:6px">'+acts+'</div>'+ trail +
    '</div></div>';
}

function piSum(a){ var s=0; a.forEach(function(x){ s+=x; }); return s*1; }
function piById(id){ return PI().filter(function(s){ return s.id===id; })[0]; }
function piGrowth(s){ return s.series[s.series.length-1]-s.series[0]; }
function piQuad(s){
  var p=piSum(s.p)>=50, i=piSum(s.i)>=50;
  if(p&&i) return {k:'strong', n:'Strong AI Thinker', d:'กำกับ AI เป็น และคิดต่อเองได้'};
  if(!p&&i) return {k:'natural', n:'Natural Thinker', d:'คิดดีอยู่แล้ว แต่ยังใช้ AI ไม่เต็มแรง'};
  if(p&&!i) return {k:'operator', n:'AI ใช้ดี แต่คิดยังไม่ถึง', d:'สั่ง AI เก่ง แต่รับคำตอบมาโดยไม่ตรวจ'};
  return {k:'early', n:'ยังต้องพัฒนา', d:'ทั้งการตั้งคำถามและการคิดต่อยังต้องฝึก'};
}
function piClassAvg(key){
  var all=PI(), n=all.length, out=[];
  (key==='p'?P_DIMS:I_DIMS).forEach(function(d,idx){
    var s=0; all.forEach(function(st){ s+=st[key][idx]; });
    out.push({name:d[1], th:d[2], v:Math.round(s/n*10)/10});
  });
  return out;
}
function piBadge(v){
  if(v==='y') return '<span class="pcomp y">✓</span>';
  if(v==='p') return '<span class="pcomp p">△</span>';
  return '<span class="pcomp n">✕</span>';
}

function piCoach(s, missing){
  if(missing.indexOf('Iteration')>=0)
    return '“ก่อนจะเลือกคำตอบไหน ช่วยระบุสมมติฐาน 3 ข้อที่ถ้าผิดแล้วข้อเสนอนี้จะพัง แล้วบอกว่าจะตรวจสมมติฐานแต่ละข้อด้วยข้อมูลอะไร”';
  if(missing.indexOf('Evaluation Criteria')>=0)
    return '“ช่วยบอกก่อนว่าถ้าจะตัดสินว่าข้อเสนอไหนดีกว่า ควรใช้เกณฑ์อะไร 3 ข้อ แล้วค่อยให้คะแนนแต่ละข้อเสนอตามเกณฑ์นั้น”';
  if(missing.indexOf('Constraint')>=0)
    return '“เพิ่มข้อจำกัดจริงของหน้างานเข้าไปด้วย เช่น งบ เวลา และคนที่มี แล้วให้ตัดข้อเสนอที่ทำไม่ได้ออกก่อนเสนอ”';
  return '“ลองให้ AI ค้านข้อสรุปของตัวเองด้วยหลักฐานที่ขัดกัน แล้วบอกว่าถ้าจะเชื่อข้อสรุปนี้ ต้องเห็นข้อมูลอะไรเพิ่ม”';
}

    (f.problem?'<div class="dsec"><b>Problem</b>ธุรกิจครอบครัวไทยจำนวนมากสะดุดตอนส่งต่อรุ่นสอง เพราะข้อมูลลูกค้า กติกาตั้งราคา และความสัมพันธ์กับซัพพลายเออร์อยู่ในความจำของผู้ก่อตั้ง</div>':'')+

    (f.evidence?'<div class="dsec"><b>Evidence และข้อจำกัด</b>ยังเป็นการทบทวนวรรณกรรม ยังไม่มีข้อมูลภาคสนาม · กรอบแนวคิดใช้ dynamic capabilities เป็น lens</div>':'')+

/* ============================================================
   Gate 3 — แดชบอร์ดเทรนด์โจทย์ธุรกิจ
   กฎเดียวที่คุมทั้งหน้า: แสดงเฉพาะสิ่งที่ระบบนับเองได้จากเหตุการณ์ของตัวเอง
   (คำค้น · คำขอ · ผลงานที่เผยแพร่ · การรับรองของอาจารย์)
   เทรนด์ตลาดภายนอกไม่มีแหล่ง จึงไม่แสดง — เขียนไว้ท้ายหน้าว่าอะไรที่รู้ไม่ได้
   สีที่ใช้: น้ำเงิน = ฝั่งความต้องการ · เขียว = ฝั่งผลงานที่มี · เทาเส้นประ = ไม่มีข้อมูลพอ
   ผ่าน validator ของ dataviz: deutan ΔE 24.1 · normal ΔE 25.1 · contrast ≥3:1
   ============================================================ */
var DEMAND = {m7:148, m1:132, m2:96, m8:81, m6:74, m5:68, m3:61, m4:57, m10:44, m9:39};
var MONTHS = ['เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.'];
var SERIES_PUB = [2,3,5,4,7,8];
var SERIES_REQ = [5,9,14,12,21,26];

function worksOf(mid){ return pubs().filter(function(p){ return p.mvp===mid; }).length; }

function gapRows(){
  return MVP.map(function(m){
    var w=worksOf(m.id), d=DEMAND[m.id]||0;
    return {id:m.id, name:m.name, g:m.g, demand:d, works:w, ratio: w? Math.round(d/w) : null};
  }).sort(function(a,b){
    if(a.ratio===null && b.ratio===null) return b.demand-a.demand;
    if(a.ratio===null) return -1;
    if(b.ratio===null) return 1;
    return b.ratio-a.ratio;
  });
}

function statTile(big, label, sub){
  return '<div class="stat"><div class="stat-n">'+big+'</div><div class="stat-l">'+label+'</div>'+
    (sub?'<div class="stat-s">'+sub+'</div>':'')+'</div>';
}

/* ---------- แท่งนอน: คำค้นต่อผลงานหนึ่งชิ้น ---------- */
function gapChart(){
  var rows=gapRows();
  var maxR=Math.max.apply(null, rows.map(function(r){ return r.ratio||0; })) || 1;
  return '<div class="chart">'+
    rows.map(function(r){
      var noSupply = r.ratio===null;
      var pct = noSupply ? 100 : Math.max(4, Math.round(r.ratio/maxR*100));
      var tip = noSupply
        ? r.name+' · ค้น '+r.demand+' ครั้งใน 30 วัน · ยังไม่มีผลงานเผยแพร่'
        : r.name+' · ค้น '+r.demand+' ครั้ง ต่อผลงาน '+r.works+' ชิ้น = '+r.ratio+' ครั้งต่อชิ้น';
      /* ป้ายอยู่ในแท่งได้เฉพาะตอนที่แท่งกว้างพอ ไม่งั้นย้ายออกมาข้างนอกเป็นสีหมึก
         กันกรณีตัวอักษรขาวล้นออกไปอยู่บนพื้นขาวแล้วอ่านไม่เห็นตอนจอแคบ */
      var inside = noSupply || pct>=45;
      var label = noSupply ? 'ยังไม่มีผลงานรองรับ · ค้น '+r.demand+' ครั้ง' : r.ratio+' ครั้งต่อผลงาน 1 ชิ้น';
      return '<div class="brow" data-act="c-mvp" data-m="'+r.id+'">'+
        '<div class="brow-l">'+r.name+'</div>'+
        '<div class="brow-t" data-tip="'+esc(tip)+'">'+
          '<div class="bar'+(noSupply?' none':'')+'" style="width:'+pct+'%"></div>'+
          '<span class="brow-v '+(inside?'in':'out')+(noSupply?' dim':'')+'">'+label+'</span>'+
        '</div>'+
        '<div class="brow-r mono">'+r.demand+' / '+r.works+'</div>'+
      '</div>';
    }).join('')+
    '<div class="lgd"><span><i class="sw blue"></i> คำค้นต่อผลงาน 1 ชิ้น (ยิ่งยาว ยิ่งขาดของ)</span>'+
      '<span><i class="sw dash"></i> ยังไม่มีผลงานให้คำนวณอัตราส่วน</span>'+
      '<span class="dim">คอลัมน์ขวา = คำค้น / จำนวนผลงาน</span></div>'+
  '</div>';
}

/* ---------- เส้น 6 เดือน (small multiples) ---------- */
function lineChart(vals, color, unit){
  var w=300, h=96, pad=8;
  var max=Math.max.apply(null, vals), min=0;
  var x=function(i){ return pad + i*((w-pad*2)/(vals.length-1)); };
  var y=function(v){ return h-pad-14 - (v-min)/(max-min||1)*(h-pad*2-14); };
  var pts=vals.map(function(v,i){ return x(i)+','+y(v); });
  var area='M'+x(0)+','+(h-pad-14)+' L'+pts.join(' L')+' L'+x(vals.length-1)+','+(h-pad-14)+' Z';
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" role="img">'+
    '<line x1="'+pad+'" y1="'+(h-pad-14)+'" x2="'+(w-pad)+'" y2="'+(h-pad-14)+'" stroke="rgba(0,0,0,.11)" stroke-width="1"/>'+
    '<path d="'+area+'" fill="'+color+'" opacity=".10"/>'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    vals.map(function(v,i){
      return '<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4" fill="'+color+'" stroke="#fff" stroke-width="2" '+
        'data-tip="'+MONTHS[i]+' · '+v+' '+unit+'"/>';
    }).join('')+
    '<text x="'+x(vals.length-1)+'" y="'+(y(vals[vals.length-1])-10)+'" text-anchor="end" '+
      'font-size="12" font-weight="600" fill="rgba(0,0,0,.88)">'+vals[vals.length-1]+'</text>'+
    MONTHS.map(function(m,i){
      return '<text x="'+x(i)+'" y="'+(h-2)+'" text-anchor="middle" font-size="10.5" fill="rgba(0,0,0,.40)">'+m+'</text>';
    }).join('')+
  '</svg>';
}

/* ---------- แถบสัดส่วน Tier ---------- */
function tierBar(){
  var all=pubs(), n=all.length||1;
  var c={A:0,B:0,C:0}; all.forEach(function(p){ c[tierOf(p)]++; });
  var seg=function(k,fill,dash){
    var pct=Math.round(c[k]/n*100); if(!c[k]) return '';
    return '<div class="tseg" style="width:calc('+pct+'% - 2px);'+
      (dash?'background:transparent;border:1.5px dashed rgba(0,0,0,.32);color:var(--ink-2)':'background:'+fill+';color:#fff')+'" '+
      'data-tip="Tier '+k+' · '+c[k]+' ชิ้น ('+pct+'%)">'+k+' · '+c[k]+'</div>';
  };
  return '<div class="tbar">'+seg('A','var(--verified)')+seg('B','rgba(0,0,0,.55)')+seg('C',null,true)+'</div>'+
    '<div class="lgd"><span><i class="sw green"></i> Tier A รับรองครบและมีผลทดสอบ</span>'+
    '<span><i class="sw ink"></i> Tier B รับรองบางส่วน</span>'+
    '<span><i class="sw dash"></i> Tier C ยังเป็นไอเดีย</span></div>';
}

  return '<h1>เทรนด์โจทย์ธุรกิจ</h1>'+

  demoBanner()+

  '<div class="dash-grid">'+
    statTile(totalWorks, 'ผลงานที่เผยแพร่ในระบบ', 'นับเฉพาะฉบับที่เจ้าของกดเผยแพร่')+

    toast('ส่งคำขอแล้ว — ยังไม่เห็นข้อมูลติดต่อจนกว่าเจ้าของจะตอบรับ'); render();
  }
};
function checkReviewed(){ S.flow.reviewed = allDecided(); }

/* ============================================================
   RENDER / ROUTER
   ============================================================ */
function render(){
  document.body.classList.toggle('explain', S.explain);
  renderSpine();
  document.querySelectorAll('#gateSeg button').forEach(function(b){ b.classList.toggle('on', b.dataset.gate===S.gate); });
  document.querySelectorAll('.tgl[data-act=explain]').forEach(function(b){ b.classList.toggle('on', S.explain); });
  document.querySelectorAll('.tgl[data-act=aidown]').forEach(function(b){ b.classList.toggle('on', S.aiDown); });
  var html='';
  if(S.gate==='teacher'){
    html = subnav([['queue','หน้าหลัก'],['review','ตรวจงาน'],['pi','Prompt & Idea'],['release','ส่ง Feedback'],['summary','ปิดรอบ']], S.screen.teacher, 't-nav')+
      ({queue:tQueue, review:tReview, pi:piClass, pistudent:piStudentView, release:tRelease, summary:tSummary}[S.screen.teacher]||tQueue)();
  } else if(S.gate==='student'){
    var sm={today:sToday, brief:sBrief, precheck:sPrecheck, receipt:sReceipt, feedback:sFeedback,
            revise:sRevise, profile:sProfile, portfolio:sPortfolio, requests:sRequests};
    html = sNav()+(sm[S.screen.student]||sToday)();
  } else {
    var cm={home:cHome, trends:cTrends, topics:cTopics, brief:cBrief, results:cResults, detail:cDetail, shortlist:cShortlist};
    html = cNav()+(cm[S.screen.company]||cHome)();
  }
  el('app').innerHTML=html;
  applyAnchor();
}
function applyAnchor(){
  if(!S.activeAnchor) return;
  var t=document.querySelector('.span[data-anchor="'+S.activeAnchor+'"]');
  if(!t) return;
  var it=S.items.filter(function(i){ return i.anchors.indexOf(S.activeAnchor)>=0; })[0];
  t.classList.add('on'); if(it && it.status==='verified') t.classList.add('v');
  if(window.innerWidth<=980 && S.pane!=='c') return;
  t.scrollIntoView({block:'center', behavior:'smooth'});
}

document.addEventListener('click', function(e){
  var span=e.target.closest('.span[data-anchor]');
  var t=e.target.closest('[data-act]');
  if(!t && span){ ACT.anchor({anchor:span.dataset.anchor}); return; }
  if(!t) return;
  if(t.classList.contains('veil') && e.target!==t) return;
  var fn=ACT[t.dataset.act];
  if(fn){ e.preventDefault(); fn(Object.assign({}, t.dataset), e); }
});
document.addEventListener('change', function(e){
  var p=e.target.dataset.pub, f=e.target.dataset.fb, v=e.target.dataset.vis;
  if(p){ S.pub.fields[p]=e.target.checked; }
  if(f){ S.addressed[f]=e.target.checked; }
  if(v){ S.pub.visibility=v; }
});
document.querySelectorAll('#gateSeg button').forEach(function(b){
  b.addEventListener('click', function(){ S.gate=b.dataset.gate; S.activeAnchor=null; render(); });
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeLayer(); });

/* hover tooltip สำหรับกราฟ — ใช้ได้กับทุก element ที่มี data-tip */
(function(){
  var tip=null;
  function hide(){ if(tip){ tip.remove(); tip=null; } }
  document.addEventListener('mouseover', function(e){
    var t=e.target.closest && e.target.closest('[data-tip]'); if(!t) return;
    hide(); tip=document.createElement('div'); tip.className='tip'; tip.textContent=t.getAttribute('data-tip');
    document.body.appendChild(tip); move(e);
  });
  function move(e){
    if(!tip) return;
    var x=e.clientX+14, y=e.clientY+16, r=tip.getBoundingClientRect();
    if(x+r.width>innerWidth-8) x=innerWidth-r.width-8;
    if(y+r.height>innerHeight-8) y=e.clientY-r.height-12;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseout', function(e){
    var t=e.target.closest && e.target.closest('[data-tip]'); if(t) hide();
  });
  document.addEventListener('scroll', hide, true);
})();
window.addEventListener('resize', function(){
  if(S.paneTouched) return;
  var want = window.innerWidth<=980 ? 'r' : 'c';
  if(S.pane!==want){ S.pane=want; if(S.gate==='teacher' && S.screen.teacher==='review') render(); }
});

seedDiag();
render();
</script>
